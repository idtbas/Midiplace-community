name: RenOS CI

# Führt alle Prüfungen von RenOS auf GitHub aus – auch ohne eigenen Rechner:
# Typecheck, Lint, Unit-/Integrationstests und Browser-E2E-Tests (Server- und lokaler Modus),
# einschließlich eines echten Ren'Py-Laufzeittests mit dem eigenen Testspiel.
on:
  push:
    paths: ['renos/**', '.github/workflows/renos-ci.yml']
  pull_request:
    paths: ['renos/**', '.github/workflows/renos-ci.yml']
  workflow_dispatch:

concurrency:
  group: renos-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ren'Py 8 (Python 3) und 7 (Python 2): Web-Testspiel, Laufzeitpakete und Windows/Linux-Testbuilds.
  RENPY8: 8.6.0
  RENPY7: 7.8.7

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: renos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: renos/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Offizielle Ren'Py-SDKs (nur Dateien; aus den SDKs wird nichts ausgeführt).
      - name: Cache Ren'Py SDKs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/renpy
          key: renpy-sdks-${{ env.RENPY8 }}-${{ env.RENPY7 }}-v2
      - name: Download Ren'Py ${{ env.RENPY8 }} and ${{ env.RENPY7 }} (engine, sample game, web runtime)
        run: |
          scripts/fetch-renpy.sh "$RENPY8" "$RUNNER_TEMP/renpy"
          scripts/fetch-renpy.sh "$RENPY7" "$RUNNER_TEMP/renpy"
          echo "RENPY_SDKS=$RUNNER_TEMP/renpy/renpy-$RENPY8-sdk,$RUNNER_TEMP/renpy/renpy-$RENPY7-sdk" >> "$GITHUB_ENV"
      - name: Assemble the RenOS test game (web build) and Windows/Linux test builds
        run: |
          npm run testgame -- "$RUNNER_TEMP/renpy/renpy-$RENPY8-sdk"
          npm run testgame:desktop

      - name: E2E (server mode)
        run: npm run test:e2e
      - name: E2E (local mode incl. Windows/Linux conversion, as on GitHub Pages)
        run: npm run test:e2e:local
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            renos/test-results
            renos/playwright-report
          retention-days: 7
