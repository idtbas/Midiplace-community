name: Deploy to GitHub Pages

# Veröffentlicht die Website:
#   /                → Midiplace (unverändert)
#   /renos/          → RenOS als Web-App (lokaler Modus: Spiele werden auf dem iPad installiert)
#   /renos-games/    → statischer Spiele-Host. Muss auf einer ANDEREN Adresse laufen als RenOS –
#                      dafür wird dieses Repository in eine (kostenlose) GitHub-Organisation geforkt,
#                      deren Pages-Adresse dann als Spiele-Host dient (siehe renos/README.md).
#
# GitHub erlaubt das Veröffentlichen standardmäßig nur vom Standard-Branch (Umgebung
# „github-pages“). Deshalb baut dieser Workflow nur dort; Feature-Branches werden über einen
# Pull Request gemergt.
on:
  push:
    branches: [claude/midiplace-prototype, main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: renos/package-lock.json
      - name: Install RenOS dependencies
        working-directory: renos
        run: npm ci
      # Ren'Py-Laufzeiten für Windows-/Linux-Spiele (offizielle SDKs von renpy.org; nichts wird ausgeführt).
      - name: Cache Ren'Py SDKs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/renpy
          key: renpy-sdks-8.6.0-7.8.7-v2
      - name: Download Ren'Py 8.6.0 and 7.8.7
        working-directory: renos
        run: |
          scripts/fetch-renpy.sh 8.6.0 "$RUNNER_TEMP/renpy"
          scripts/fetch-renpy.sh 7.8.7 "$RUNNER_TEMP/renpy"
      - name: Build RenOS (local mode, with Ren'Py runtimes)
        working-directory: renos
        env:
          RENPY_SDKS: ${{ runner.temp }}/renpy/renpy-8.6.0-sdk,${{ runner.temp }}/renpy/renpy-7.8.7-sdk
          RENOS_BASE: /${{ github.event.repository.name }}/renos/
          # Optional: Adresse des Spiele-Hosts als Repository-Variable vorbelegen
          # (Settings → Secrets and variables → Actions → Variables → RENOS_GAME_HOST_URL).
          VITE_RENOS_GAME_HOST: ${{ vars.RENOS_GAME_HOST_URL }}
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html css js _site/
          cp -r renos/apps/web/dist-local _site/renos
          find _site/renos -name '*.map' -delete
          mkdir _site/renos-games
          cp renos/apps/gamehost/*.html renos/apps/gamehost/*.js renos/apps/gamehost/*.json _site/renos-games/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
