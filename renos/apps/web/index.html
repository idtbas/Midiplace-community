<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>RenOS</title>
    <meta name="description" content="RenOS – Desktop-Umgebung für das iPad mit Bibliothek und Player für Ren’Py-Webspiele." />
    <meta name="theme-color" content="#11151c" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RenOS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Startbildschirm ohne JavaScript – verschwindet, sobald RenOS geladen ist. */
      html, body { margin: 0; height: 100%; background: #11151c; color: #e8ecf2; }
      #boot-splash {
        position: fixed; inset: 0; display: grid; place-items: center; z-index: 1;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      }
      #boot-splash .mark { width: 72px; height: 72px; opacity: .92; }
      #boot-splash .bar { width: 120px; height: 3px; margin: 28px auto 0; border-radius: 3px; background: #242b36; overflow: hidden; }
      #boot-splash .bar::after {
        content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: #87a9e8;
        animation: boot-slide 1.1s ease-in-out infinite alternate;
      }
      @keyframes boot-slide { from { transform: translateX(-10%); } to { transform: translateX(160%); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash .bar::after { animation: none; width: 100%; opacity: .5; } }
      #root:not(:empty) + #boot-splash { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <div>
        <img class="mark" src="/favicon.svg" alt="" />
        <div class="bar"></div>
      </div>
    </div>
    <noscript>RenOS benötigt JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
